# ============================================================
# uEmuera iOS 云端构建（GitHub Actions）
#
# 路线：仓库只放 Unity 源工程，云端 runner 现场：
#         1. 用 Unity 2019.4.40f1c1 导出 Xcode 工程
#         2. 用 Xcode 无签名编译
#         3. 注入 TrollStore entitlements
#         4. 打包 .tipa
#
# 运行器选择（重要）：
#   macos-13 已于 2025-12-04 退役。
#   实测 macos-14(ARM64) 不可用：GameCI 的 setup-mac.ts 会按 runner 架构
#   给 Unity Hub 传 --architecture arm64，而 Unity 2019.4 根本没有 arm64 版本，
#   导致 "Missing [Unity] section in ini data" 安装失败。
#   因此必须用 Intel 架构 runner：macos-15-intel（标准 runner，公开库免费）。
#   Xcode 16 的新链接器编译老 Unity 库会报 duplicate symbols，
#   通过 -ld_classic 切回旧链接器解决。
#
# 链接期已知问题（本文件已处理，勿回退）：
#   Unity 2019.4 导出的工程同时带两套注册实现，
#   RegisterMonoModules.cpp 与 UnityClassRegistration.mm /
#   UnityICallRegistration.cpp 定义同名符号，必须删掉后者（步骤见 build job）。
#
# 性能说明：
#   首次构建需下载 Unity 编辑器 2-3GB，耗时 40-70 分钟属正常。
#   已缓存 Unity 编辑器与 Library，第二次起约 15-25 分钟。
#   不要因为"看起来没动"而取消——下载阶段日志不刷新。
# ============================================================

name: Build iOS tipa

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  XCODE_APP: /Applications/Xcode_16.1.app
  CACHE_SCOPE: mac-intel-u2019.4.40f1
  # 注意：GameCI 的 unity-builder 只识别标准版本号。
  # 本地工程标注的是 2019.4.40f1c1（中国特供版），
  # 但 GameCI 从 Unity 官方源下载，拉不到 c1 版，
  # 因此这里用同小版本的标准版 2019.4.40f1。
  UNITY_VERSION: 2019.4.40f1

jobs:
  # ---------- 阶段一：Unity 导出 Xcode 工程 ----------
  export:
    name: Unity export Xcode project
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Show runner info
        run: |
          echo "架构: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          ls /Applications | grep -i xcode || true

      # ---- 缓存 1：Unity 编辑器本体（省掉 30 分钟下载的关键）----
      - name: Cache Unity Editor
        id: cache-unity
        uses: actions/cache@v4
        with:
          path: /Applications/Unity/Hub/Editor
          key: UnityEditor-${{ env.CACHE_SCOPE }}

      # ---- 缓存 2：Unity 导入缓存（加速脚本编译）----
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            Library
            ~/Library/Unity/cache
          key: UnityLib-${{ env.CACHE_SCOPE }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json') }}
          restore-keys: UnityLib-${{ env.CACHE_SCOPE }}-

      - name: Notice
        run: |
          echo "::notice::开始 Unity 导出。首次需下载约 2-3GB Unity 编辑器，"
          echo "::notice::该阶段可持续 30-60 分钟且日志不刷新，属正常现象，请勿取消。"

      # ---- Unity 导出 ----
      - name: Unity Build (export iOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: UEmueraBuilder.TuanjieCloudBuild.BuildProject

      - name: Locate exported Xcode project
        id: locate
        run: |
          echo "--- 导出目录扫描 ---"
          find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -o -maxdepth 4 -name "Unity-iPhone.xcworkspace" | head -20
          PROJ=$(find . -maxdepth 5 -name "Unity-iPhone.xcodeproj" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::没找到 Unity-iPhone.xcodeproj，Unity 导出可能失败。"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
          echo "导出目录: $DIR"
          du -sh "$DIR" || true

      - name: Upload Xcode project as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: ${{ env.PROJ_DIR }}
          retention-days: 3
          compression-level: 0

  # ---------- 阶段二：编译 + 打包 tipa ----------
  build:
    name: Build unsigned tipa
    needs: export
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Select Xcode
        run: |
          echo "--- /Applications 下的 Xcode ---"
          ls -d /Applications/Xcode*.app || true

          echo "--- 已安装的 iOS 模拟器 runtime ---"
          xcrun simctl list runtimes 2>/dev/null | grep -i ios || echo "(无 iOS runtime)"

          # 挑选策略：优先选「已安装对应 iOS 模拟器 runtime」的 Xcode。
          # 原因：编译 LaunchScreen-*.storyboard 用的 ibtool 需要 iOS 平台
          # runtime，GitHub runner 镜像只预装部分 runtime（2025-08 起最多 3 个），
          # 若选中没 runtime 的 Xcode 会报
          #   "LaunchScreen-iPhone.storyboard: error: iOS XX Platform Not Installed."
          XC_LIST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V)
          RUNTIMES=$(xcrun simctl list runtimes 2>/dev/null | grep -oiE 'iOS [0-9]+\.[0-9]+' | sort -u)

          TARGET=""
          if [ -n "$RUNTIMES" ]; then
            for XC in $XC_LIST; do
              XCV=$(echo "$XC" | grep -oE 'Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/Xcode_//')
              MAJMIN=$(echo "$XCV" | cut -d. -f1,2)
              if echo "$RUNTIMES" | grep -q "iOS $MAJMIN"; then
                TARGET="$XC"
                echo "✓ $XC 有匹配的 iOS runtime ($MAJMIN)"
                break
              fi
            done
          fi

          if [ -z "$TARGET" ]; then
            echo "::warning::没有 Xcode 与已装 iOS runtime 版本匹配，回退到 $XCODE_APP"
            TARGET="$XCODE_APP"
            [ -d "$TARGET" ] || TARGET=$(echo "$XC_LIST" | head -n 1)
          fi

          echo "最终选用: $TARGET"
          sudo xcode-select -s "$TARGET"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Ensure iOS platform runtime
        run: |
          echo "=== 当前运行时 ==="
          xcrun simctl list runtimes 2>/dev/null || true

          SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDKVER"

          if xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS $SDKVER"; then
            echo "✓ 已有 iOS $SDKVER runtime，无需下载"
          else
            echo "未找到 iOS $SDKVER runtime，尝试下载（较慢，请耐心）..."
            # -downloadPlatform 只装当前 Xcode 对应的 iOS 平台
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$SDKVER" || \
              sudo xcodebuild -downloadPlatform iOS || \
              echo "::warning::自动下载失败，继续尝试构建（storyboard 可能报错）"
            xcrun simctl list runtimes 2>/dev/null || true
          fi

      - name: Install ldid
        run: brew install ldid

      - name: Prepare entitlements
        run: |
          mkdir -p ci
          cat > ci/entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>platform-application</key><true/>
            <key>get-task-allow</key><true/>
          </dict>
          </plist>
          EOF
          cat ci/entitlements.plist

      # -ld_classic：Xcode 15 新链接器对老 Unity 静态库会报 duplicate symbols，
      #              切回旧链接器即可。Unity 2019.4 + Xcode 15 的标准解法。
      # Windows 推到 Git 的工程会丢失 Unix 执行位，
      # Unity 导出的 MapFileParser.sh 等脚本必须可执行，否则 Xcode
      # 会在 PhaseScriptExecution 阶段报 Permission denied。
      - name: Fix script permissions
        run: |
          echo "--- 修复前 ---"
          ls -l MapFileParser.sh 2>/dev/null || true
          find . -name "*.sh" -type f -not -path "./build/*" -exec chmod +x {} \;
          chmod +x MapFileParser.sh 2>/dev/null || true
          echo "--- 修复后 ---"
          ls -l MapFileParser.sh 2>/dev/null || true

      # Unity 2019.4 导出的工程模板带了 32 位 ARM 专用选项 -mno-thumb，
      # 在 arm64-only 构建下新 clang 会直接报
      #   "unsupported option '-mno-thumb' for target 'arm64-apple-ios14.0'"
      # 这里从 pbxproj 与 xcconfig 中就地移除。
      - name: Strip -mno-thumb flag
        run: |
          for f in Unity-iPhone.xcodeproj/project.pbxproj $(find . -maxdepth 2 -name "*.xcconfig" 2>/dev/null); do
            [ -f "$f" ] || continue
            if grep -q -- "-mno-thumb" "$f"; then
              echo "修补: $f"
              sed -i.bak 's/ -mno-thumb//g; s/-mno-thumb //g; s/-mno-thumb//g' "$f"
              rm -f "$f.bak"
            fi
          done
          echo "--- 检查残留 ---"
          grep -rn -- "-mno-thumb" Unity-iPhone.xcodeproj/ 2>/dev/null || echo "✓ 已无 -mno-thumb"

      # ---- 关键修复：剔除重复的类注册源文件（必须两手都做）----
      #
      # Unity 2019.4 导出的工程里存在两套并存的 class/icall 注册实现：
      #   Libraries/RegisterMonoModules.cpp   <- 2019.x 的正确实现，必须保留
      #   Classes/Native/UnityClassRegistration.cpp
      #   Classes/Native/UnityICallRegistration.cpp   <- 必须剔除
      # 它们定义了相同的符号（RegisterAllClasses()、
      # InvokeRegisterStaticallyLinkedModuleClasses()、
      # _RegisterStaticallyLinkedModulesGranular、RegisterAllStrippedInternalCalls()），
      # 同时编入 UnityFramework 会在链接期报 duplicate symbol。
      #
      # 踩坑记录：只改 pbxproj 删条目 → 文件仍在，仍被编译，重复符号照旧；
      #           只删文件 → pbxproj 里 CompileC 条目仍在，Xcode 直接报
      #             "Build input file cannot be found"。
      #           必须两步都做：先从 pbxproj 摘掉编译条目，再删磁盘文件。
      - name: Prepare pbxproj stripping script
        run: |
          cat > .ci_strip_registration.py <<'PYEOF'
          import re, sys

          pbx = sys.argv[1]
          targets = ['UnityClassRegistration', 'UnityICallRegistration']

          with open(pbx, encoding='utf-8', errors='surrogateescape') as fh:
              lines = fh.read().split('\n')

          # 1) 收集与目标文件相关的所有 24 位 UUID（PBXBuildFile / PBXFileReference 等）
          uuids = set()
          for ln in lines:
              if any(t in ln for t in targets):
                  uuids.update(re.findall(r'\b[0-9A-Fa-f]{24}\b', ln))

          # 2) 整行删除：命中文件名、引用其 UUID、或仅剩分隔符的残留行
          out, removed = [], 0
          for ln in lines:
              hit = any(t in ln for t in targets) or any(u in ln for u in uuids)
              if not hit and re.match(r'^\s*[;,]\s*$', ln):
                  hit = True
              if hit:
                  removed += 1
              else:
                  out.append(ln)

          with open(pbx, 'w', encoding='utf-8', errors='surrogateescape') as fh:
              fh.write('\n'.join(out))

          print('pbxproj: 删除 %d 行, 关联 UUID %d 个' % (removed, len(uuids)))

          # 3) 平衡性自检：花括号/圆括号数量必须仍然成对
          txt = '\n'.join(out)
          if txt.count('{') != txt.count('}') or txt.count('(') != txt.count(')'):
              print('::error::pbxproj 结构可能已被破坏（括号不平衡）')
              sys.exit(1)
          print('OK: pbxproj 括号平衡')
          PYEOF
          echo "已生成 .ci_strip_registration.py"

      - name: Remove duplicate class registration sources
        run: |
          PBX=Unity-iPhone.xcodeproj/project.pbxproj

          echo "--- 移除前，pbxproj 中的相关条目 ---"
          grep -nE "UnityClassRegistration|UnityICallRegistration" "$PBX" | head -30 || echo "(无)"

          cp "$PBX" "$PBX.bak"
          python3 .ci_strip_registration.py "$PBX"

          echo "--- pbxproj 校验 ---"
          if grep -qE "UnityClassRegistration|UnityICallRegistration" "$PBX"; then
            echo "::warning::pbxproj 仍有残留引用"
            grep -nE "UnityClassRegistration|UnityICallRegistration" "$PBX" | head -10 || true
          else
            echo "OK: pbxproj 已无相关引用"
          fi

          # 顺序很重要：先摘掉 pbxproj 条目，再删磁盘文件
          echo "--- 删除源文件 ---"
          for f in UnityClassRegistration.mm UnityClassRegistration.cpp \
                   UnityICallRegistration.cpp UnityICallRegistration.mm; do
            find . -type f -name "$f" -not -path "./build/*" -print -delete || true
          done

          echo "--- 最终校验 ---"
          if find . -type f \( -name "UnityClassRegistration.*" -o -name "UnityICallRegistration.*" \) \
               -not -path "./build/*" | grep -q .; then
            echo "::warning::仍存在重复注册源文件"
          else
            echo "OK: 源文件已移除"
          fi
          echo "保留（必须存在）:"
          find . -type f -name "RegisterMonoModules.*" -not -path "./build/*"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            OTHER_LDFLAGS="-ld_classic" \
            OTHER_CFLAGS="" \
            GCC_PRECOMPILE_PREFIX_HEADER=NO \
            -derivedDataPath build \
            | tee build.log | tail -150

      - name: Assemble Payload
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没找到 .app 产物，请查看 build-log artifact。"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          # 注意：$APP_NAME 是去掉了 .app 后缀的名字（如 uEmuera），
          # 而 Payload 下的目录保留完整后缀（uEmuera.app）。
          # 二者不同，务必用 APP_BUNDLE 拼路径，否则 ldid 会报 errno=2。
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_BUNDLE=$APP_NAME.app" >> $GITHUB_ENV
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          echo "产物: $APP_PATH"
          echo "--- Payload 内容 ---"
          ls -la dist/Payload/
          echo "--- 可执行文件架构（应含 arm64）---"
          lipo -info "dist/Payload/$APP_NAME.app/$APP_NAME" || true

      - name: Inject TrollStore entitlements
        run: |
          BIN="dist/Payload/$APP_BUNDLE/$APP_NAME"
          if [ ! -f "$BIN" ]; then
            echo "::error::找不到可执行文件: $BIN"
            ls -la "dist/Payload/$APP_BUNDLE/" || true
            exit 1
          fi
          ldid -Sci/entitlements.plist "$BIN"
          echo "已注入 no-sandbox + platform-application"
          echo "--- 回读校验 ---"
          ldid -e "$BIN" || true

      - name: Package tipa
        run: |
          cd dist
          # Payload 下的 .app 目录名带后缀，tipa 文件名用 APP_NAME 即可
          [ -d "$APP_BUNDLE" ] || { echo "::error::Payload 中缺少 $APP_BUNDLE"; ls -la; exit 1; }
          zip -qry "$APP_NAME.tipa" Payload
          rm -rf Payload
          ls -lh *.tipa

      - name: Upload tipa
        uses: actions/upload-artifact@v4
        with:
          name: uEmuera-tipa
          path: dist/*.tipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
