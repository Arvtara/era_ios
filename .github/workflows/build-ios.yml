# ============================================================
# uEmuera iOS 云端构建（GitHub Actions）
#
# 路线：仓库只放 Unity 源工程，云端 runner 现场：
#         1. 用 Unity 2019.4.40f1c1 导出 Xcode 工程
#         2. 用 Xcode 无签名编译
#         3. 注入 TrollStore entitlements
#         4. 打包 .tipa
#
# 运行器选择（重要）：
#   macos-13 已于 2025-12-04 退役。
#   实测 macos-14(ARM64) 不可用：GameCI 的 setup-mac.ts 会按 runner 架构
#   给 Unity Hub 传 --architecture arm64，而 Unity 2019.4 根本没有 arm64 版本，
#   导致 "Missing [Unity] section in ini data" 安装失败。
#   因此必须用 Intel 架构 runner：macos-15-intel（标准 runner，公开库免费）。
#
# 【已定案的启动崩溃根因：RUNTIME_IL2CPP 宏缺失，切勿删除修复步骤】
#
# 现象：App 装上后图标一闪即退（TrollStore 安装、不开 JIT 也一样）。
# 崩溃栈：MetadataCache::Initialize() -> SIGSEGV, KERN_INVALID_ADDRESS at 0x4
#
# 反汇编 UnityFramework 后彻底定位（2026-10 结论，证据链完整）：
#   0x4621d4  adrp x0, #0x59b000
#   0x4621d8  add  x0, x0, #0x420      ; x0 = "global-metadata.dat"
#   0x4621dc  bl   #0x45c144           ; MetadataLoader::LoadMetadataFile()
#   0x4621e0  adrp x24, #0x6b1000
#   0x4621e4  str  x0, [x24, #0x5e0]   ; s_GlobalMetadata = <非空，加载成功>
#   0x4621e8  cbz  x0, #0x462820       ; 若为空则直接 return 1，不会崩
#   0x4621ec  adrp x8, #0x6b1000
#   0x4621f0  ldr  x8, [x8, #0x5d8]    ; x8 = s_Il2CppCodeGenOptions == NULL
#   0x4621f4  ldr  w0, [x8, #4]        ; <<< 崩溃，far = 0x4
#
# 符号表证明：
#   0x6b15d8  __ZL22s_Il2CppCodeGenOptions      <- 全二进制只有这一处"读"，无任何"写"
#   0x6b15e0  __ZL16s_GlobalMetadata            <- 有写入且非空
#   0x6b15e8  __ZL22s_GlobalMetadataHeader      <- 由 0x462204 之后的代码写入
#
# 即：与 global-metadata.dat 无关（该文件经结构校验完全正常，设备上 md5 也一致），
#     真正的病根是 s_Il2CppCodeGenOptions 这个 IL2CPP 运行期全局永远为 NULL。
#
# 为什么为 NULL：Unity 的 Il2CppCodeRegistration.cpp 里，注册对象被宏守护：
#     #if RUNTIME_IL2CPP
#     static il2cpp::utils::RegisterRuntimeInitializeAndCleanup
#         s_Il2CppCodegenRegistrationVariable(&s_Il2CppCodegenRegistration, NULL);
#     #endif
# 只要编译 UnityFramework 时没有定义 RUNTIME_IL2CPP=1，这个静态注册变量就不会
# 生成，s_Il2CppCodeGenOptions 便永远不被赋值。
# 本工程导出的 Xcode 模板恰好缺失该宏（Tuanjie c1 与标准 Unity 2019.4 模板差异），
# 因此必须由 CI 显式补上：
#   "Force RUNTIME_IL2CPP flag"      -> 给 UnityFramework 的 OTHER_CFLAGS 注入
#                                       -DRUNTIME_IL2CPP=1 -DINIT_SCRIPTING_BACKEND=1
#   "Verify IL2CPP registration"     -> nm 校验注册符号确实被链接进二进制，否则中断
#
# iOS 脚本后端（同样重要）：
#   ProjectSettings.asset 的 scriptingBackend 必须显式包含 iPhone: 1 (IL2CPP)，
#   否则导出阶段不会真正跑 il2cpp.exe。由 export job 的
#   "Verify IL2CPP was actually used" 步骤兜底拦截。
#
# 性能说明：
#   首次构建需下载 Unity 编辑器 2-3GB，耗时 40-70 分钟属正常。
#   已缓存 Unity 编辑器与 Library，第二次起约 15-25 分钟。
#   不要因为"看起来没动"而取消——下载阶段日志不刷新。
# ============================================================

name: Build iOS tipa

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  # 固定到 macos-15-intel 上较低的小版本（16.1），避开 16.4 新链接器
  # 对 Unity 2019.4 老工程产生的畸形 LC_RPATH/LC_LOAD_DYLIB。
  XCODE_APP: /Applications/Xcode_16.1.app
  CACHE_SCOPE: mac-intel-u2019.4.40f1
  # 注意：GameCI 的 unity-builder 只识别标准版本号。
  # 本地工程标注的是 2019.4.40f1c1（中国特供版），
  # 但 GameCI 从 Unity 官方源下载，拉不到 c1 版，
  # 因此这里用同小版本的标准版 2019.4.40f1。
  UNITY_VERSION: 2019.4.40f1

jobs:
  # ---------- 阶段一：Unity 导出 Xcode 工程 ----------
  export:
    name: Unity export Xcode project
    runs-on: macos-15-intel
    timeout-minutes: 180
    outputs:
      metadata_md5: ${{ steps.verify_il2cpp.outputs.metadata_md5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Show runner info
        run: |
          echo "架构: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          ls /Applications | grep -i xcode || true

      # ---- 缓存 1：Unity 编辑器本体（省掉 30 分钟下载的关键）----
      - name: Cache Unity Editor
        id: cache-unity
        uses: actions/cache@v4
        with:
          path: /Applications/Unity/Hub/Editor
          key: UnityEditor-${{ env.CACHE_SCOPE }}

      # ---- 缓存 2：Unity 导入缓存（加速脚本编译）----
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            Library
            ~/Library/Unity/cache
          key: UnityLib-${{ env.CACHE_SCOPE }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json') }}
          restore-keys: UnityLib-${{ env.CACHE_SCOPE }}-

      - name: Notice
        run: |
          echo "::notice::开始 Unity 导出。首次需下载约 2-3GB Unity 编辑器，"
          echo "::notice::该阶段可持续 30-60 分钟且日志不刷新，属正常现象，请勿取消。"

      # ---- Unity 导出 ----
      - name: Unity Build (export iOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: UEmueraBuilder.TuanjieCloudBuild.BuildProject

      - name: Locate exported Xcode project
        id: locate
        run: |
          echo "--- 导出目录扫描 ---"
          find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -o -maxdepth 4 -name "Unity-iPhone.xcworkspace" | head -20
          PROJ=$(find . -maxdepth 5 -name "Unity-iPhone.xcodeproj" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::没找到 Unity-iPhone.xcodeproj，Unity 导出可能失败。"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
          echo "导出目录: $DIR"
          du -sh "$DIR" || true

      # ---- 致命校验：确认 iOS 真的走了 IL2CPP ----
      #
      # 背景（血泪教训）：ProjectSettings.asset 的 scriptingBackend 漏配 iPhone
      # 项时，iOS 会静默回落到 Mono2x，Unity 导出阶段根本不执行 il2cpp.exe。
      # 但工程目录里可能残留上一次 IL2CPP 构建产出的 global-metadata.dat，
      # 于是打出一个"带着 IL2CPP 运行时 + 对不上的 metadata"的包：
      # 装上图标一闪即退，崩溃栈定格在
      #   il2cpp::vm::MetadataCache::Initialize()  ->  SIGSEGV at 0x4
      # 这个错误在 Xcode 编译期完全看不出来，必须在这里拦。
      - name: Verify IL2CPP was actually used
        id: verify_il2cpp
        run: |
          DIR="$PROJ_DIR"
          echo "检查导出目录: $DIR"
          FAIL=0

          # 1) IL2CPP 生成的代码目录必须存在且非空
          NATIVE="$DIR/Classes/Native"
          echo "--- Classes/Native ---"
          if [ -d "$NATIVE" ]; then
            COUNT=$(find "$NATIVE" -name "*.cpp" -o -name "*.mm" | wc -l | tr -d ' ')
            echo "生成文件数: $COUNT"
            ls "$NATIVE" | head -20 || true
            if [ "$COUNT" -lt 1 ]; then
              echo "::error::$NATIVE 为空 —— IL2CPP 未生成代码"
              FAIL=1
            fi
          else
            echo "::error::缺少 $NATIVE —— 未走 IL2CPP 后端"
            FAIL=1
          fi

          # 2) global-metadata.dat 必须存在，并记录指纹供人工比对
          META=$(find "$DIR" -name "global-metadata.dat" | head -n 1)
          if [ -z "$META" ]; then
            echo "::error::找不到 global-metadata.dat"
            FAIL=1
          else
            echo "--- global-metadata.dat ---"
            ls -l "$META"
            MD5=$(md5 -q "$META" 2>/dev/null || md5sum "$META" | awk '{print $1}')
            SIZE=$(stat -f%z "$META" 2>/dev/null || stat -c%s "$META")
            echo "md5=$MD5 size=$SIZE"
            [ -n "$GITHUB_ENV" ] && echo "METADATA_MD5=$MD5" >> "$GITHUB_ENV"
            [ -n "$GITHUB_OUTPUT" ] && echo "metadata_md5=$MD5" >> "$GITHUB_OUTPUT"
            # 头部校验：magic 必须为 0xFAB11BAF (小端存储 => 字节序 af 1b b1 fa)
            # 用 od 而非 xxd，保证 macOS 与 Linux 上都有
            MAGIC=$(od -An -tx1 -N4 "$META" | tr -d ' \n')
            echo "magic(LE)=$MAGIC"
            if [ "$MAGIC" != "af1bb1fa" ]; then
              echo "::error::global-metadata.dat 头部 magic 异常($MAGIC)，文件可能损坏或为占位符"
              FAIL=1
            fi
            if [ "$SIZE" -lt 100000 ]; then
              echo "::error::global-metadata.dat 仅 $SIZE 字节，明显不是有效元数据"
              FAIL=1
            fi
          fi

          # 3) 导出日志里应能见到 il2cpp 的踪迹（有日志则顺带佐证，缺失不致命）
          if [ -f "$DIR/../export.log" ]; then
            echo "--- 导出日志中的 il2cpp 踪迹 ---"
            grep -i "il2cpp" "$DIR/../export.log" | head -10 || echo "(日志中未见 il2cpp 字样)"
          fi

          if [ "$FAIL" = "1" ]; then
            echo "::error::IL2CPP 校验未通过，产物必定在启动时崩溃，终止构建。"
            echo "::error::请检查 ProjectSettings.asset 的 scriptingBackend 是否含 iPhone: 1"
            exit 1
          fi
          echo "OK: IL2CPP 导出校验通过"

      # ---- metadata 结构自检 ----
      #
      # 对 il2cpp 生成的 global-metadata.dat 做逐 section 校验：
      #   magic / version、31 个 section 的越界与重叠、字符串堆可解码性。
      # 目的是在打包前排除"构建侧文件本身损坏/截断"这一分支。
      # 若此处通过、设备上仍启动崩溃，则问题在打包/安装链路，而非构建。
      # ---- 致命校验：确认 iOS 渲染后端候选列表含 Metal ----
      #
      # 背景（本轮启动崩溃的真正根因）：
      # ProjectSettings.asset 的 m_BuildTargetGraphicsAPIs 为空数组时，
      # Unity 导出会走兜底分支，把候选渲染 API 填成 OpenGLES2。
      # iOS 16 以后的 A 系列设备上 EAGLContext 无法创建 OpenGLES2 上下文，
      # SelectRenderingAPIImpl() 遍历完所有候选后返回 0，_renderingAPI 保持 0，
      # 于是 App 启动瞬间在 renderingAPI 处断言失败：
      #
      #   NSAssert(_renderingAPI != 0,
      #       @"[UnityAppController renderingAPI] called before "
      #        "[UnityAppController selectRenderingApi]");
      #
      # 崩溃栈（iPhone SE 3 / iOS 16.3）：
      #   -[UnityAppController(Rendering) renderingAPI]
      #   -[UnityAppController application:didFinishLaunchingWithOptions:]
      #   _userInfoForFileAndLine -> NSInternalInconsistencyException -> abort()
      #
      # 反汇编 UnityFramework 中 UnityGetRenderingAPIs 可确认兜底行为：
      #   配置数量为 0 -> apis[0] = 2 (apiOpenGLES2)，返回 1
      #   配置 0x08 -> apiOpenGLES2 / 0x0b -> apiOpenGLES3 / 0x10 -> apiMetal
      #
      # 构建脚本已在导出前强制设置并写入 build-info.txt，这里读回来复核。
      - name: Verify iOS graphics API is Metal
        run: |
          INFO=$(find . -name "build-info.txt" | head -n 1)
          if [ -z "$INFO" ]; then
            echo "::warning::未找到 build-info.txt，无法复核图形 API 配置"
            exit 0
          fi
          echo "--- build-info.txt ---"
          cat "$INFO"

          API=$(grep -i '^ios_graphics_api=' "$INFO" | cut -d= -f2-)
          echo "ios_graphics_api = $API"

          if [ -z "$API" ]; then
            echo "::warning::build-info.txt 中无 ios_graphics_api 字段，跳过复核"
            exit 0
          fi
          if [ "$API" != "Metal" ]; then
            echo "::error::iOS 图形 API 当前为 '$API'，不是 Metal。"
            echo "::error::Unity 会把候选渲染 API 兜底成 OpenGLES2，"
            echo "::error::在 iOS 16+ 的 A 系列设备上必然启动即崩溃。终止构建。"
            exit 1
          fi
          echo "OK: iOS 图形 API 已确认为 Metal"

          # 顺带确认导出的 Xcode 工程里确实编译了 Metal 后端
          NATIVE="$PROJ_DIR/Classes/Native"
          if [ -d "$NATIVE" ]; then
            HITS=$(grep -ril "GfxDeviceMetal\|MetalContext\|UnityGetRenderingAPIs" "$NATIVE" 2>/dev/null | wc -l | tr -d ' ')
            echo "Native 目录中提及 Metal 相关符号的文件数: $HITS"
          fi


      - name: Validate global-metadata structure
        run: |
          META=$(find "$PROJ_DIR" -name "global-metadata.dat" | head -n 1)
          if [ -z "$META" ]; then
            echo "::error::找不到 global-metadata.dat"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.ci/check_metadata.py" "$META"

      - name: Upload Xcode project as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: ${{ env.PROJ_DIR }}
          retention-days: 3
          compression-level: 0

  # ---------- 阶段二：编译 + 打包 tipa ----------
  build:
    name: Build unsigned tipa
    needs: export
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # 从 export job 传过来的 metadata 指纹，用于在打包前比对产物是否混入旧文件
      METADATA_MD5: ${{ needs.export.outputs.metadata_md5 }}
    steps:
      # build job 也需要仓库里的 .ci 脚本（Verify tipa integrity 会调用
      # .ci/check_metadata.py）。缺了会报 can't open file。
      # 注意顺序：先 checkout 拿到脚本，再由 download-artifact 解压工程，
      # 且把工程解到子目录，避免覆盖仓库文件。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Stash CI scripts
        run: |
          echo "工作目录: $GITHUB_WORKSPACE"
          ls -la .ci/ 2>/dev/null || echo "(无 .ci 目录)"
          mkdir -p /tmp/ci
          cp -f .ci/*.py /tmp/ci/ 2>/dev/null || true
          ls -la /tmp/ci/ || true
          echo "CI_SCRIPTS=/tmp/ci" >> "$GITHUB_ENV"

      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Select Xcode
        run: |
          echo "--- /Applications 下的 Xcode ---"
          ls -d /Applications/Xcode*.app || true

          echo "--- 已安装的 iOS 模拟器 runtime ---"
          xcrun simctl list runtimes 2>/dev/null | grep -i ios || echo "(无 iOS runtime)"

          # 挑选策略：优先选「已安装对应 iOS 模拟器 runtime」的 Xcode。
          # 原因：编译 LaunchScreen-*.storyboard 用的 ibtool 需要 iOS 平台
          # runtime，GitHub runner 镜像只预装部分 runtime（2025-08 起最多 3 个），
          # 若选中没 runtime 的 Xcode 会报
          #   "LaunchScreen-iPhone.storyboard: error: iOS XX Platform Not Installed."
          #
          # 补充（重要）：不要选最新的 Xcode。Xcode 16 的新链接器会破坏
          # Unity 2019.4 导出工程的 LC_RPATH/LC_LOAD_DYLIB 生成，产出
          #   LC_LOAD_WEAK_DYLIB "path/Frameworks"（未展开的字面量）
          # 且缺失 LC_RPATH，导致 dyld 启动失败、App 闪退。
          # 因此在小版本相同的候选里，优先挑更低的（16.1 < 16.4）。
          XC_LIST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V)
          RUNTIMES=$(xcrun simctl list runtimes 2>/dev/null | grep -oiE 'iOS [0-9]+\.[0-9]+' | sort -u)

          # 优先固定版本；只有它不存在时才回退到自动挑选。
          if [ -d "$XCODE_APP" ]; then
            TARGET="$XCODE_APP"
            echo "使用固定的 Xcode: $TARGET"
          else
            echo "::warning::$XCODE_APP 不存在，回退到自动挑选"
            TARGET=$(echo "$XC_LIST" | head -n 1)
          fi

          echo "最终选用: $TARGET"
          sudo xcode-select -s "$TARGET"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Ensure iOS platform runtime
        run: |
          echo "=== 当前运行时 ==="
          xcrun simctl list runtimes 2>/dev/null || true

          SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDKVER"

          if xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS $SDKVER"; then
            echo "✓ 已有 iOS $SDKVER runtime，无需下载"
          else
            echo "未找到 iOS $SDKVER runtime，尝试下载（较慢，请耐心）..."
            # -downloadPlatform 只装当前 Xcode 对应的 iOS 平台
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$SDKVER" || \
              sudo xcodebuild -downloadPlatform iOS || \
              echo "::warning::自动下载失败，继续尝试构建（storyboard 可能报错）"
            xcrun simctl list runtimes 2>/dev/null || true
          fi

      - name: Install ldid
        run: brew install ldid

      - name: Prepare entitlements
        run: |
          mkdir -p ci
          cat > ci/entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>platform-application</key><true/>
            <key>get-task-allow</key><true/>
          </dict>
          </plist>
          EOF
          cat ci/entitlements.plist

      # Windows 推到 Git 的工程会丢失 Unix 执行位，
      # Unity 导出的 MapFileParser.sh 等脚本必须可执行，否则 Xcode
      # 会在 PhaseScriptExecution 阶段报 Permission denied。
      - name: Fix script permissions
        run: |
          echo "--- 修复前 ---"
          ls -l MapFileParser.sh 2>/dev/null || true
          find . -name "*.sh" -type f -not -path "./build/*" -exec chmod +x {} \;
          chmod +x MapFileParser.sh 2>/dev/null || true
          echo "--- 修复后 ---"
          ls -l MapFileParser.sh 2>/dev/null || true

      # ---- 致命修复：强制注入 RUNTIME_IL2CPP 宏 ----
      #
      # 背景见文件头注释。简言之：Unity 的 Il2CppCodeRegistration.cpp 用
      #   #if RUNTIME_IL2CPP
      #   static RegisterRuntimeInitializeAndCleanup s_Il2CppCodegenRegistrationVariable(...);
      #   #endif
      # 守护注册对象。少了这个宏，s_Il2CppCodeGenOptions 永远为 NULL，
      # 运行时 MetadataCache::Initialize() 会在 ldr w0,[x8,#4] 处以
      # SIGSEGV at 0x4 崩溃（图标一闪即退）。
      #
      # 本工程导出的模板未带该宏，这里无条件补上。做法：
      #   1) 给 UnityFramework target 的 OTHER_CFLAGS 追加两个 -D
      #   2) 若模板把 CFLAGS 放在 xcconfig，则一并追加
      # 采用「追加而非替换」，即使模板已带也不会重复报错。
      - name: Force RUNTIME_IL2CPP flag
        run: |
          PBX="Unity-iPhone.xcodeproj/project.pbxproj"
          if [ ! -f "$PBX" ]; then
            echo "::error::找不到 $PBX"
            exit 1
          fi

          echo "--- 修补前 UnityFramework 的 OTHER_CFLAGS ---"
          grep -n "OTHER_CFLAGS" "$PBX" || echo "(无 OTHER_CFLAGS)"

          python3 - "$PBX" <<'PY'
          import re, sys
          p = sys.argv[1]
          src = open(p, encoding='utf-8', errors='surrogateescape').read()
          NEED = '-DRUNTIME_IL2CPP=1 -DINIT_SCRIPTING_BACKEND=1'

          # 在 buildSettings 字典里为 UnityFramework target 的 DEBUG/RELEASE 配置
          # 补 OTHER_CFLAGS。pbxproj 是 OpenStep plist，用正则按块处理最稳。
          # 匹配形如  XXXXXXXX /* Debug */ = { ... buildSettings = { ... }; ... };
          added = 0
          def patch(m):
              global added
              block = m.group(0)
              if 'OTHER_CFLAGS' in block:
                  # 已有该键：把缺失的 -D 追加进去
                  def addflags(mm):
                      global added
                      val = mm.group(1)
                      new = val
                      for f in ('-DRUNTIME_IL2CPP=1', '-DINIT_SCRIPTING_BACKEND=1'):
                          if f not in new:
                              new = new.rstrip() + ' ' + f
                      if new != val:
                          added += 1
                      return 'OTHER_CFLAGS = "%s";' % new.strip()
                  return re.sub(r'OTHER_CFLAGS = "([^"]*)";', addflags, block)
              else:
                  # 没有该键：在 buildSettings = { 之后插入
                  if 'buildSettings = {' in block:
                      added += 1
                      return block.replace(
                          'buildSettings = {',
                          'buildSettings = {\n\t\t\t\tOTHER_CFLAGS = "%s";' % NEED, 1)
                  return block

          # 逐个 buildSettings 块处理
          out = re.sub(r'buildSettings = \{.*?\n\t\t\t\};', patch, src, flags=re.S)
          if added == 0:
              print('警告: 未识别到可修补的 buildSettings 块，回退为全局追加')
          open(p, 'w', encoding='utf-8', errors='surrogateescape').write(out)
          print('修补配置块数:', added)
          PY

          # 兜底：如果 pbxproj 里根本没有 OTHER_CFLAGS（上述正则未命中），
          # 直接在所有 buildSettings 里硬插一次。
          if ! grep -q "RUNTIME_IL2CPP" "$PBX"; then
            echo "回退方案：用 perl 全局插入 OTHER_CFLAGS"
            perl -0pi -e 's/(buildSettings = \{)/$1\n\t\t\t\tOTHER_CFLAGS = "-DRUNTIME_IL2CPP=1 -DINIT_SCRIPTING_BACKEND=1";/g' "$PBX"
          fi

          echo "--- 修补后 ---"
          grep -c "RUNTIME_IL2CPP" "$PBX" || true
          grep -n "OTHER_CFLAGS" "$PBX" | head -10 || true

          # xcconfig 形式（若存在）
          for xc in $(find . -maxdepth 3 -name "*.xcconfig" 2>/dev/null); do
            if ! grep -q "RUNTIME_IL2CPP" "$xc"; then
              echo "附加到 xcconfig: $xc"
              echo 'OTHER_CFLAGS = $(inherited) -DRUNTIME_IL2CPP=1 -DINIT_SCRIPTING_BACKEND=1' >> "$xc"
            fi
          done

          if ! grep -q "RUNTIME_IL2CPP" "$PBX"; then
            echo "::error::未能注入 RUNTIME_IL2CPP，产物必定启动崩溃，终止构建"
            exit 1
          fi
          echo "OK: RUNTIME_IL2CPP 已注入"

      # Unity 2019.4 导出的工程模板带了 32 位 ARM 专用选项 -mno-thumb，
      # 在 arm64-only 构建下新 clang 会直接报
      #   "unsupported option '-mno-thumb' for target 'arm64-apple-ios14.0'"
      # 这里从 pbxproj 与 xcconfig 中就地移除。
      - name: Strip -mno-thumb flag
        run: |
          for f in Unity-iPhone.xcodeproj/project.pbxproj $(find . -maxdepth 2 -name "*.xcconfig" 2>/dev/null); do
            [ -f "$f" ] || continue
            if grep -q -- "-mno-thumb" "$f"; then
              echo "修补: $f"
              sed -i.bak 's/ -mno-thumb//g; s/-mno-thumb //g; s/-mno-thumb//g' "$f"
              rm -f "$f.bak"
            fi
          done
          echo "--- 检查残留 ---"
          grep -rn -- "-mno-thumb" Unity-iPhone.xcodeproj/ 2>/dev/null || echo "✓ 已无 -mno-thumb"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            LD_RUNPATH_SEARCH_PATHS="@executable_path/Frameworks @loader_path/Frameworks" \
            -derivedDataPath build \
            | tee build.log | tail -150

      # ---- 门禁：确认 IL2CPP 代码注册符号真的被链接进 UnityFramework ----
      #
      # 这是本轮崩溃的「照妖镜」。若 RUNTIME_IL2CPP 宏没生效，
      # Il2CppCodeRegistration.cpp 里的静态注册对象不会生成，
      # nm 就查不到 s_Il2CppCodegenRegistration / Il2CppCodegenRegistration，
      # 运行时必然在 MetadataCache::Initialize() 崩在 0x4。
      # 这里直接查符号，比任何间接推断都可靠。
      - name: Verify IL2CPP registration is linked
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          FW="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          if [ ! -f "$FW" ]; then
            echo "::error::找不到 UnityFramework: $FW"
            exit 1
          fi
          echo "检查: $FW"
          nm -a "$FW" > /tmp/nm.txt 2>/dev/null || nm "$FW" > /tmp/nm.txt 2>/dev/null || true
          echo "符号总数: $(wc -l < /tmp/nm.txt)"

          echo "--- 搜索 IL2CPP 注册相关符号 ---"
          grep -iE "CodegenRegistration|Il2CppCodegenRegistration|s_Il2CppCodeGenOptions" /tmp/nm.txt || true

          FAIL=0
          # 核心：注册对象必须存在。UNITY 的命名在不同版本略有差异，按宽松匹配。
          if ! grep -qiE "CodegenRegistration" /tmp/nm.txt; then
            echo "::error::UnityFramework 中不存在 CodegenRegistration 符号 ——"
            echo "::error::说明 -DRUNTIME_IL2CPP=1 未生效，s_Il2CppCodeGenOptions 将为 NULL，"
            echo "::error::运行时必定在 MetadataCache::Initialize() 崩溃。终止构建。"
            FAIL=1
          fi
          # 全局变量符号应当存在（可能是私有符号，nm -a 可见）
          if ! grep -qE "s_Il2CppCodeGenOptions" /tmp/nm.txt; then
            echo "::warning::未直接看到 s_Il2CppCodeGenOptions 符号（可能已被 strip，继续）"
          fi

          # 同时用反汇编确认崩溃点前确实有对 0x5d8 槽位的读取（自检脚本可用性）
          echo "--- otool 概览 ---"
          otool -L "$FW" | head -5 || true

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "OK: IL2CPP 注册符号已链接"

      # ---- 关键校验：确认 dyld 能正确找到 UnityFramework ----
      #
      # 已实测的故障产物：主程序只带
      #   LC_LOAD_WEAK_DYLIB "path/Frameworks"   <- 变量未展开的字面量
      # 且完全没有 LC_RPATH，导致 dyld 启动即失败、App 闪退。
      # 这里在打包前就把问题拦住，避免又出一个装不上的 tipa。
      - name: Verify dyld load commands
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          BIN="$APP/$(basename "$APP" .app)"
          echo "检查: $BIN"
          otool -l "$BIN" > /tmp/lc.txt 2>&1 || true

          echo "--- LC_RPATH ---"
          grep -A2 "LC_RPATH" /tmp/lc.txt || echo "(无 LC_RPATH)"

          echo "--- 依赖的 dylib ---"
          otool -L "$BIN" | tail -n +2 || true

          FAIL=0
          if grep -qE '"/?path/Frameworks"|"path/Frameworks"' /tmp/lc.txt; then
            echo "::error::检测到未展开的畸形路径 path/Frameworks，dyld 必然失败"
            FAIL=1
          fi
          if ! grep -q "LC_RPATH" /tmp/lc.txt; then
            echo "::error::主程序缺少 LC_RPATH，将无法定位 Frameworks 目录"
            FAIL=1
          fi
          if ! otool -L "$BIN" | grep -q "UnityFramework"; then
            echo "::warning::主程序未直接引用 UnityFramework（部分 Unity 模板为运行时 dlopen，可接受）"
          fi

          if [ "$FAIL" = "1" ]; then
            echo "::error::加载命令校验失败，产物不可用，终止以免产出坏包"
            exit 1
          fi
          echo "OK: 加载命令正常"

          echo "--- UnityFramework 自身的 RPATH / ID ---"
          FW="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          otool -D "$FW" 2>/dev/null || true
          otool -l "$FW" 2>/dev/null | grep -A2 "LC_RPATH" || echo "(Framework 无 LC_RPATH，正常)"

          # ---- 校验：打进 .app 的 metadata 必须与导出阶段生成的指纹一致 ----
          # 若这里对不上，说明打包路径混入了旧的 global-metadata.dat，
          # 运行时会在 MetadataCache::Initialize() 崩溃。
          echo "--- global-metadata.dat 指纹 ---"
          META_IN_APP="$APP/Data/Managed/Metadata/global-metadata.dat"
          if [ ! -f "$META_IN_APP" ]; then
            echo "::error::.app 中缺少 global-metadata.dat"
            exit 1
          fi
          MD5_IN_APP=$(md5 -q "$META_IN_APP" 2>/dev/null || md5sum "$META_IN_APP" | awk '{print $1}')
          echo "构建产物 md5 = $MD5_IN_APP"
          if [ -n "$METADATA_MD5" ]; then
            echo "导出阶段 md5 = $METADATA_MD5"
            if [ "$MD5_IN_APP" != "$METADATA_MD5" ]; then
              echo "::error::metadata 指纹不一致，产物可能混入旧文件"
              exit 1
            fi
            echo "OK: metadata 指纹一致"
          else
            echo "::warning::未拿到导出阶段指纹（跨 job 传递限制），跳过比对"
          fi

      - name: Assemble Payload
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没找到 .app 产物，请查看 build-log artifact。"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          # 注意：$APP_NAME 是去掉了 .app 后缀的名字（如 uEmuera），
          # 而 Payload 下的目录保留完整后缀（uEmuera.app）。
          # 二者不同，务必用 APP_BUNDLE 拼路径，否则 ldid 会报 errno=2。
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_BUNDLE=$APP_NAME.app" >> $GITHUB_ENV
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          echo "产物: $APP_PATH"
          echo "--- Payload 内容 ---"
          ls -la dist/Payload/
          echo "--- 可执行文件架构（应含 arm64）---"
          lipo -info "dist/Payload/$APP_NAME.app/$APP_NAME" || true

      - name: Inject TrollStore entitlements
        run: |
          BIN="dist/Payload/$APP_BUNDLE/$APP_NAME"
          if [ ! -f "$BIN" ]; then
            echo "::error::找不到可执行文件: $BIN"
            ls -la "dist/Payload/$APP_BUNDLE/" || true
            exit 1
          fi
          ldid -Sci/entitlements.plist "$BIN"
          echo "已注入 no-sandbox + platform-application"
          echo "--- 回读校验 ---"
          ldid -e "$BIN" || true

      - name: Package tipa
        run: |
          cd dist
          # 注意：此处已进入 dist，Bundle 在 Payload 下，路径要带 Payload/ 前缀。
          # Payload 内的 .app 目录名带后缀，tipa 文件名用 APP_NAME 即可。
          if [ ! -d "Payload/$APP_BUNDLE" ]; then
            echo "::error::Payload 中缺少 $APP_BUNDLE"
            ls -la Payload/ || true
            exit 1
          fi
          zip -qry "$APP_NAME.tipa" Payload
          echo "--- 打包前内容 ---"
          unzip -l "$APP_NAME.tipa" | head -15
          rm -rf Payload
          ls -lh *.tipa
          echo "TIPA_PATH=dist/$APP_NAME.tipa" >> "$GITHUB_ENV"

      # ---- 打包后回验：解压 tipa，核对关键文件是否与源一致 ----
      #
      # 用于捕捉打包/压缩环节引入的文件损坏：
      #   - global-metadata.dat 的 md5 必须与 export 阶段指纹一致
      #   - 关键文件（主程序、UnityFramework、Info.plist）必须齐全
      #   - 主程序必须可执行，且携带 TrollStore 所需 entitlements
      - name: Verify tipa integrity
        run: |
          TIPA="${TIPA_PATH:-dist/$APP_NAME.tipa}"
          echo "检查: $TIPA"
          rm -rf /tmp/tipa_check && mkdir -p /tmp/tipa_check
          unzip -q "$TIPA" -d /tmp/tipa_check

          APP="/tmp/tipa_check/Payload/$APP_BUNDLE"
          FAIL=0

          echo "--- 关键文件 ---"
          for f in "$APP_NAME" "Info.plist" \
                   "Frameworks/UnityFramework.framework/UnityFramework" \
                   "Data/Managed/Metadata/global-metadata.dat"; do
            if [ -e "$APP/$f" ]; then
              ls -l "$APP/$f"
            else
              echo "::error::缺少 $f"
              FAIL=1
            fi
          done

          if [ ! -x "$APP/$APP_NAME" ]; then
            echo "::error::主程序缺失或不可执行: $APP/$APP_NAME"
            FAIL=1
          fi
          if [ ! -f "$APP/Frameworks/UnityFramework.framework/UnityFramework" ]; then
            echo "::error::UnityFramework 缺失"
            FAIL=1
          fi
          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::Info.plist 缺失"
            FAIL=1
          fi

          # metadata 指纹比对
          META="$APP/Data/Managed/Metadata/global-metadata.dat"
          if [ ! -f "$META" ]; then
            echo "::error::tipa 内缺少 global-metadata.dat"
            FAIL=1
          else
            MD5=$(md5 -q "$META" 2>/dev/null || md5sum "$META" | awk '{print $1}')
            SZ=$(stat -f%z "$META" 2>/dev/null || stat -c%s "$META")
            echo "tipa 内 metadata: md5=$MD5 size=$SZ"
            if [ "$SZ" -ne 2747904 ]; then
              echo "::warning::metadata 大小与上次构建(2747904)不同，代码或 Unity 版本可能已变更"
            fi
            if [ -n "$METADATA_MD5" ]; then
              echo "导出阶段指纹: $METADATA_MD5"
              if [ "$MD5" != "$METADATA_MD5" ]; then
                echo "::error::打包后 metadata 指纹不一致 —— 打包环节损坏了文件"
                FAIL=1
              else
                echo "OK: metadata 指纹一致"
              fi
            fi
          # 结构复检（对解压后的副本再跑一次）
          # build job 里的脚本从 /tmp/ci 取（checkout 后另存的副本），
          # 找不到时回退到工程目录，双保险。
          CHK="${CI_SCRIPTS:-$GITHUB_WORKSPACE/.ci}/check_metadata.py"
          if [ ! -f "$CHK" ]; then
            CHK="$GITHUB_WORKSPACE/.ci/check_metadata.py"
          fi
          if [ -f "$CHK" ]; then
            python3 "$CHK" "$META" || FAIL=1
          else
            echo "::warning::未找到 check_metadata.py，跳过结构复检（不影响产物可用性）"
          fi
          fi

          # 主程序 entitlements（TrollStore 安装时会自行重签，此处仅作记录）
          echo "--- 主程序签名 ---"
          if command -v codesign >/dev/null 2>&1; then
            codesign -d --entitlements - "$APP/$APP_NAME" 2>&1 | head -20 || true
          else
            echo "(无 codesign，跳过)"
          fi

          if [ "$FAIL" = "1" ]; then
            echo "::error::tipa 完整性校验失败"
            exit 1
          fi
          echo "OK: tipa 完整性校验通过"

      - name: Upload tipa
        uses: actions/upload-artifact@v4
        with:
          name: uEmuera-tipa
          path: dist/*.tipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
