# ============================================================
# uEmuera iOS 云端构建（GitHub Actions）
#
# 路线：仓库只放 Unity 源工程，云端 runner 现场：
#         1. 用 Unity 2019.4.40f1c1 导出 Xcode 工程
#         2. 用 Xcode 无签名编译
#         3. 注入 TrollStore entitlements
#         4. 打包 .tipa
#
# 运行器选择（重要）：
#   macos-13 已于 2025-12-04 退役，现在只能选 macos-14 / macos-15。
#   macos-14 是 ARM64(Apple Silicon)，可用 Xcode 为 15.0.1~16.2。
#   本 workflow 选最接近 Unity 2019.4 的 Xcode 15.0.1。
#   Xcode 15 换了新链接器，编译老 Unity 库会报 duplicate symbols，
#   通过 -ld_classic 切回旧链接器解决。
#
# 性能说明：
#   首次构建需下载 Unity 编辑器 2-3GB，耗时 40-70 分钟属正常。
#   已缓存 Unity 编辑器与 Library，第二次起约 15-25 分钟。
#   不要因为"看起来没动"而取消——下载阶段日志不刷新。
# ============================================================

name: Build iOS tipa

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  XCODE_APP: /Applications/Xcode_15.0.1.app
  CACHE_SCOPE: mac-arm64-u2019.4.40f1
  # 注意：GameCI 的 unity-builder 只识别标准版本号。
  # 本地工程标注的是 2019.4.40f1c1（中国特供版），
  # 但 GameCI 从 Unity 官方源下载，拉不到 c1 版，
  # 因此这里用同小版本的标准版 2019.4.40f1。
  UNITY_VERSION: 2019.4.40f1

jobs:
  # ---------- 阶段一：Unity 导出 Xcode 工程 ----------
  export:
    name: Unity export Xcode project
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Show runner info
        run: |
          echo "架构: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          ls /Applications | grep -i xcode || true

      # ---- 缓存 1：Unity 编辑器本体（省掉 30 分钟下载的关键）----
      - name: Cache Unity Editor
        id: cache-unity
        uses: actions/cache@v4
        with:
          path: /Applications/Unity/Hub/Editor
          key: UnityEditor-${{ env.CACHE_SCOPE }}

      # ---- 缓存 2：Unity 导入缓存（加速脚本编译）----
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            Library
            ~/Library/Unity/cache
          key: UnityLib-${{ env.CACHE_SCOPE }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json') }}
          restore-keys: UnityLib-${{ env.CACHE_SCOPE }}-

      - name: Notice
        run: |
          echo "::notice::开始 Unity 导出。首次需下载约 2-3GB Unity 编辑器，"
          echo "::notice::该阶段可持续 30-60 分钟且日志不刷新，属正常现象，请勿取消。"

      # ---- Unity 导出 ----
      - name: Unity Build (export iOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: UEmueraBuilder.TuanjieCloudBuild.BuildProject

      - name: Locate exported Xcode project
        id: locate
        run: |
          echo "--- 导出目录扫描 ---"
          find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -o -maxdepth 4 -name "Unity-iPhone.xcworkspace" | head -20
          PROJ=$(find . -maxdepth 5 -name "Unity-iPhone.xcodeproj" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::没找到 Unity-iPhone.xcodeproj，Unity 导出可能失败。"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
          echo "导出目录: $DIR"
          du -sh "$DIR" || true

      - name: Upload Xcode project as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: ${{ env.PROJ_DIR }}
          retention-days: 3
          compression-level: 0

  # ---------- 阶段二：编译 + 打包 tipa ----------
  build:
    name: Build unsigned tipa
    needs: export
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install ldid
        run: brew install ldid

      - name: Prepare entitlements
        run: |
          mkdir -p ci
          cat > ci/entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>platform-application</key><true/>
            <key>get-task-allow</key><true/>
          </dict>
          </plist>
          EOF
          cat ci/entitlements.plist

      # -ld_classic：Xcode 15 新链接器对老 Unity 静态库会报 duplicate symbols，
      #              切回旧链接器即可。Unity 2019.4 + Xcode 15 的标准解法。
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            OTHER_LDFLAGS="-ld_classic" \
            -derivedDataPath build \
            | tee build.log | tail -150

      - name: Assemble Payload
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没找到 .app 产物，请查看 build-log artifact。"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          echo "产物: $APP_PATH"

      - name: Inject TrollStore entitlements
        run: |
          ldid -Sci/entitlements.plist "dist/Payload/$APP_NAME/$APP_NAME"
          echo "已注入 no-sandbox + platform-application"
          ldid -e "dist/Payload/$APP_NAME/$APP_NAME" || true

      - name: Package tipa
        run: |
          cd dist
          zip -qry "$APP_NAME.tipa" Payload
          rm -rf Payload
          ls -lh *.tipa

      - name: Upload tipa
        uses: actions/upload-artifact@v4
        with:
          name: uEmuera-tipa
          path: dist/*.tipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
